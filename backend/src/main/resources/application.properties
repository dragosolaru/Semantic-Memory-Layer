spring.application.name=semantic-memory
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/semanticmemory;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

jwt.secret=semantic-memory-secret-key-minimum-256-bits-for-hs256
jwt.expiration=86400000

openai.api.key=${OPENAI_API_KEY:sk-placeholder}