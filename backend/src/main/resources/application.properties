spring.application.name=semantic-memory
spring.profiles.active=dev
server.port=8080

# CORS - comma-separated list of allowed origins
app.cors.allowed-origins=http://localhost:3000

# Cookie settings
app.cookie.name=ACCESS_TOKEN
app.cookie.refresh-name=REFRESH_TOKEN
app.cookie.same-site=None

spring.datasource.url=jdbc:postgresql://localhost:5432/semanticmemory
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

jwt.secret=${JWT_SECRET:semantic-memory-secret-key-minimum-256-bits-for-hs256-development}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

openai.api.key=${OPENAI_API_KEY:sk-placeholder}

# File upload settings
app.upload.directory=./uploads/profile-images
app.upload.max-size=5242880

# Multipart configuration (Spring Boot)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.location=/tmp

# Google OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email