spring.application.name=semantic-memory
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/semanticmemory
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.enabled=false

jwt.secret=semantic-memory-secret-key-minimum-256-bits-for-hs256
jwt.expiration=86400000

openai.api.key=${OPENAI_API_KEY:sk-placeholder}